[pytest]
# Tests import the backend modules by bare name (import app, import truth, ...),
# mirroring how the app itself imports them. pythonpath adds backend/ to sys.path.
pythonpath = .
testpaths = tests
addopts = -q
# Pin pytest-asyncio's fixture loop scope to its future default (the suite is synchronous;
# this only quiets the transitive plugin's deprecation warning).
asyncio_default_fixture_loop_scope = function
