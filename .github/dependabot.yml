# Weekly update proposals for every pinned dependency (Diensteleitfaden: keep dependencies current).
# Each proposal runs through ci.yml like any other pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
    ignore:
      # Angular pins the TypeScript range (Angular 22: >=6.0 <6.1); TypeScript follows an Angular update.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node: only LTS lines (even majors) for the build stage.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
