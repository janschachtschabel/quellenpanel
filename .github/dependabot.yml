# Weekly update proposals for every pinned dependency (Diensteleitfaden: keep dependencies current).
# Each proposal runs through ci.yml like any other pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
