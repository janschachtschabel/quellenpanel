name: Release

# Sets the tag v<version> on main and publishes a GitHub release with the CHANGELOG section of that
# version. Started by hand only (Actions → Release → Run workflow, branch main). The version comes
# from backend/pyproject.toml; CI checks that frontend and chart carry the same one. Tags created
# with GITHUB_TOKEN start no other workflow, so the image build is dispatched explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Version, branch and tag check
        id: v
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Nur von main"; exit 1; }
          v=$(python3 -c "import tomllib;print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::Tag v$v gibt es schon"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Kein CHANGELOG-Abschnitt für ${{ steps.v.outputs.version }}"; exit 1; }
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" --target "$GITHUB_SHA" --title "Quellenpanel $v" --notes-file notes.md
      - name: Build the image for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "v${{ steps.v.outputs.version }}"
