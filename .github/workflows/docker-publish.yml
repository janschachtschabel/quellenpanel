name: Build & Push Docker image

# Runs the CI gates (ci.yml), then builds the serving image and publishes it to the GitHub Container
# Registry (ghcr.io/<owner>/quellenpanel: main, sha-…, versions; the server compose pulls :main) and,
# when its secrets exist, to Docker Hub. Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub user +
# access token). The image name is <DOCKERHUB_USERNAME>/quellenpanel (adjust below if needed).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read-only token: the image goes to Docker Hub with its own secrets, nothing writes to the repository.
permissions:
  contents: read

jobs:
  # All quality gates (lint, tests, audits, chart, version, tag = "v" + version) — see ci.yml.
  ci:
    uses: ./.github/workflows/ci.yml

  # Gate the publish on the Docker Hub secrets actually being present, so the workflow stays green
  # (with a warning) on forks / repos without credentials instead of failing at the login step.
  check-secrets:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check Docker Hub credentials
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — skipping image build & push."
          fi

  docker:
    needs: [ci, check-secrets]
    runs-on: ubuntu-latest
    # Publish only when the credentials are present (skips cleanly otherwise).
    if: ${{ needs.check-secrets.outputs.present == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quellenpanel
          # Release images carry the version (tag v1.0.0 → 1.0.0 and 1.0); main → main + sha. Never `latest`
          # (metadata-action would add it to semver tags by default).
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Image for the server compose (docker-compose.yml pulls ghcr.io/<owner>/quellenpanel:main on every
  # deploy). Needs no secret: the workflow token may write this repository's package. The package is
  # public, so a server pulls it without a login.
  ghcr:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
