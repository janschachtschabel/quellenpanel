# Quellenpanel on a Docker server behind an existing Traefik proxy (ports 80/443, Let's Encrypt).
# Runs the image GitHub builds from this repository (ghcr.io/janschachtschabel/quellenpanel), like
# the other apps on the server: every deploy (a Docker panel's redeploy included) pulls the newest
# image of main. QE_VERSION in .env pins a release only when one is wanted (e.g. 1.0.1).
#
# Standard: ONE instance on ONE port serves every tier. Tier 0 (public list, widgets) is open;
# tier 1 (Steckbrief) needs QE_TIER1_PASSWORD, tier 2 (audit, corrections) QE_TEAM_PASSWORD.
# Without a password that tier stays closed. An embedding chooses its tier with ?tier=…
#
#   team     all tiers, full data                     → https://DOMAIN  or  http://SERVER:PORT (18080)
#
# Optional, SEPARATE_INSTANCES=1: two more instances that only hold their tier export, so the
# public server never stores internal data (see deploy/README.md):
#
#   partner  tier 0/1                                 → https://PARTNER_DOMAIN  or  :PARTNER_PORT (18081)
#   public   tier 0                                   → https://PUBLIC_DOMAIN   or  :PUBLIC_PORT (18082)
#
# The first deploy needs no variable at all: the instance builds the data (a few minutes, the
# pages answer 503 meanwhile). Then fill in .env (start: .env.example) and deploy again.
# Which state runs: /api/capabilities → "revision" (commit) and "built" (build time).
# Logs: docker compose logs -f team
# Data: volume quellenpanel-data (corrections, history, data). Port 9090 (metrics, exports) stays inside.

services:
  team:
    image: ghcr.io/janschachtschabel/quellenpanel:${QE_VERSION:-main}
    # Pulled on every deploy, so the server always runs the newest image of main (or QE_VERSION).
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Direct access without a domain. BIND=127.0.0.1 keeps it on this host (with separate instances).
      - "${BIND:-0.0.0.0}:${PORT:-18080}:8080"
    volumes:
      - quellenpanel-data:/data
    environment:
      QE_ROLE: team
      # Tier 2 (audit, corrections). Empty: no team access (fail-closed).
      QE_TEAM_PASSWORD: ${QE_TEAM_PASSWORD:-}
      # Tier 1 (Steckbrief). Empty: tier 1 stays closed (fail-closed).
      QE_TIER1_PASSWORD: ${QE_TIER1_PASSWORD:-}
      # Empty: a random key is created once in the data volume (logins survive restarts).
      QE_SESSION_SECRET: ${QE_SESSION_SECRET:-}
      # Starting copies of korrekturen.csv and crawler.csv for an empty volume.
      QE_SEED_URL: ${QE_SEED_URL:-https://raw.githubusercontent.com/janschachtschabel/quellenpanel/main/profiles/wlo/daten}
      QE_AUTO_REFRESH_HOUR: ${QE_AUTO_REFRESH_HOUR:-3}
      # Repository profile (profiles/<name>, default wlo) and its URLs; empty: those of the profile.
      QE_PROFILE: ${QE_PROFILE:-}
      QE_REPO_URL: ${QE_REPO_URL:-}
      QE_SEARCH_URL: ${QE_SEARCH_URL:-}
      # Behind the proxy the client address is the rightmost X-Forwarded-For entry; on the direct
      # port (public peer address) the header is ignored.
      TRUST_PROXY: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-quellenpanel-web}"
      - "traefik.http.routers.quellenpanel-team.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.quellenpanel-team.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.quellenpanel-team.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.quellenpanel-team.loadbalancer.server.port=8080"

  partner:
    image: ghcr.io/janschachtschabel/quellenpanel:${QE_VERSION:-main}
    pull_policy: always
    # Off unless SEPARATE_INSTANCES=1.
    deploy:
      replicas: ${SEPARATE_INSTANCES:-0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QE_ROLE: partner
      # Tier 1 password. Empty: tier 1 stays closed on this instance.
      QE_TIER1_PASSWORD: ${QE_TIER1_PASSWORD:-}
      QE_EXPORT_SOURCE: http://team:9090/internal/exports/stufe{tier}.json
      QE_EXPORT_POLL_MINUTES: ${QE_EXPORT_POLL_MINUTES:-10}
      # Repository profile (profiles/<name>, default wlo) and its URLs; empty: those of the profile.
      QE_PROFILE: ${QE_PROFILE:-}
      QE_REPO_URL: ${QE_REPO_URL:-}
      QE_SEARCH_URL: ${QE_SEARCH_URL:-}
      TRUST_PROXY: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-quellenpanel-web}"
      - "traefik.http.routers.quellenpanel-partner.rule=Host(`${PARTNER_DOMAIN:-}`)"
      - "traefik.http.routers.quellenpanel-partner.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.quellenpanel-partner.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.quellenpanel-partner.loadbalancer.server.port=8080"
    ports:
      - "${PARTNER_PORT:-18081}:8080"
    depends_on:
      - team

  public:
    image: ghcr.io/janschachtschabel/quellenpanel:${QE_VERSION:-main}
    pull_policy: always
    # Off unless SEPARATE_INSTANCES=1.
    deploy:
      replicas: ${SEPARATE_INSTANCES:-0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QE_ROLE: public
      QE_EXPORT_SOURCE: http://team:9090/internal/exports/stufe{tier}.json
      QE_EXPORT_POLL_MINUTES: ${QE_EXPORT_POLL_MINUTES:-10}
      # Repository profile (profiles/<name>, default wlo) and its URLs; empty: those of the profile.
      QE_PROFILE: ${QE_PROFILE:-}
      QE_REPO_URL: ${QE_REPO_URL:-}
      QE_SEARCH_URL: ${QE_SEARCH_URL:-}
      TRUST_PROXY: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-quellenpanel-web}"
      - "traefik.http.routers.quellenpanel-public.rule=Host(`${PUBLIC_DOMAIN:-}`)"
      - "traefik.http.routers.quellenpanel-public.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.quellenpanel-public.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.quellenpanel-public.loadbalancer.server.port=8080"
    ports:
      - "${PUBLIC_PORT:-18082}:8080"
    depends_on:
      - team

networks:
  default:
    name: ${TRAEFIK_NETWORK:-quellenpanel-web}

volumes:
  quellenpanel-data:
