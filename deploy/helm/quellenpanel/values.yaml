########################################################################################################################
# GLOBAL
########################################################################################################################

## @section Global parameters
global:

  ## @param global.annotations Define global annotations added to every pod
  annotations: {}

  cluster:

    cert:
      ## @param global.cluster.cert.annotations Set custom global cert annotations on the ingress
      annotations: {}

    ## @param global.cluster.domain Set global domain for the cluster
    domain: cluster.local

    ingress:
      ## @param global.cluster.ingress.ingressClassName Set global ingress class name
      ingressClassName: "nginx"

    pdb:
      ## @param global.cluster.pdb.enabled Enable PodDisruptionBudget
      enabled: false

  ## @param global.debug Enable global debugging
  debug: false

  image:
    ## @param global.image.pullPolicy Set global image pullPolicy
    pullPolicy: IfNotPresent
    ## @param global.image.pullSecrets Set global image pullSecrets
    pullSecrets: []
    ## @param global.image.registry Set global image container registry
    registry: docker.edu-sharing.com
    ## @param global.image.repository Set global image container repository (path under the registry)
    repository: projects/wlo/quellenpanel

  ## @param global.security Set global custom pod security context parameters (merged into podSecurityContext)
  security: {}

########################################################################################################################
# LOCAL
########################################################################################################################

## @section Local parameters
## @param nameOverride Override the chart name used for resource names
nameOverride: ""
## @param fullnameOverride Fully override the generated resource name
fullnameOverride: ""

image:
  ## @param image.name Override image repository (defaults to global.image.registry/global.image.repository)
  name: ""
  ## @param image.tag Set image tag (defaults to .Chart.AppVersion)
  tag: ""

########################################################################################################################

## @param replicaCount Replicas for the partner/public roles (they hold only the export). The team role
##                     always runs exactly 1 replica with strategy Recreate (rebuild job + data volume).
replicaCount: 1

########################################################################################################################

service:
  ## @param service.type Set service type
  type: ClusterIP
  ## @param service.port Set service port (cluster-internal) of the API/SPA; the container listens on 8080
  port: 8080
  ## @param service.internalPort Port of the second Service "<fullname>-internal" (container port 9090:
  ##        /health, /ready, /metrics, /internal/exports). Never route an ingress to it.
  internalPort: 9090

########################################################################################################################

ingress:

  ## @param ingress.enabled Enable ingress
  enabled: true

  annotations:
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-body-size Max request body size (the API caps bodies at 1 MB)
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-read-timeout Set proxy-read-timeout on nginx ingress
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-send-timeout Set proxy-send-timeout on nginx ingress
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-buffering Disable response buffering — stream the SPA bundle + API directly (single uvicorn worker)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

  ## @param ingress.hosts Set ingress hosts
  hosts:
  - quellenpanel.127.0.0.1.nip.io

  ## @param ingress.paths Set paths served from the host
  paths:
  - /

  ## @param ingress.tls Set TLS for ingress
  #  - secretName: quellenpanel-tls
  #    hosts:
  #    - quellenpanel.example.de
  tls: []

########################################################################################################################

## @section Application configuration
## One release per role. Secrets (passwords, session key) go into the chart Secret, or into an existing
## Secret (config.existingSecret) with the keys QE_TEAM_PASSWORD, QE_TIER1_PASSWORD, QE_SESSION_SECRET.
config:

  ## @param config.role Instance role: public (tier 0), partner (tier 1, password) or team (tier 2, data owner)
  role: public
  ## @param config.profile Repository profile (profiles/<id>/profil.toml in the image)
  profile: wlo
  ## @param config.teamPassword Team role: enables tier 2 (Audit). Empty ⇒ no team access (fail-closed). Secret.
  teamPassword: ""
  ## @param config.tier1Password Partner role: password for tier 1 (Steckbrief). Empty ⇒ tier 1 closed. Secret.
  tier1Password: ""
  ## @param config.sessionSecret Team role: HMAC key for team sessions (e.g. openssl rand -hex 32). Empty ⇒ logins end on restart. Secret.
  sessionSecret: ""
  ## @param config.existingSecret Use this existing Secret for the three secret keys instead of the chart's Secret
  existingSecret: ""
  ## @param config.exportSource Partner/public: URL of the team's export, "{tier}" is replaced (e.g. http://quellenpanel-team-internal:9090/internal/exports/stufe{tier}.json)
  exportSource: http://quellenpanel-team-internal:9090/internal/exports/stufe{tier}.json
  ## @param config.exportPollMinutes Partner/public: re-fetch interval of the export in minutes (0 = off)
  exportPollMinutes: 10
  ## @param config.seedUrl Team: base URL with crawler.csv, korrekturen.csv, truth.json for the first start. Empty ⇒ no build until both CSVs are uploaded in the team area (the image carries no corrections)
  seedUrl: ""
  ## @param config.autoRefreshHour Team: hour 0–23 for the nightly data rebuild. Empty ⇒ off (the RebuildStale alert then fires after 26 h)
  autoRefreshHour: ""
  ## @param config.allowedOrigins Comma-separated origins allowed a credentialed cross-origin team login (embedded widget). Empty ⇒ same-origin only
  allowedOrigins: ""
  ## @param config.frameAncestors Who may embed the iframe widgets (/embed/…), space-separated CSP sources, e.g. "https://wirlernenonline.de". Empty ⇒ anywhere (team: 'self')
  frameAncestors: ""
  ## @param config.thumbCacheMB Memory budget of the preview-image cache in MiB (0 = off); counts toward the memory limit
  thumbCacheMB: 16
  ## @param config.trustProxy Take the client IP from X-Forwarded-For (rightmost entry). Only behind an ingress that OVERWRITES the header (ingress-nginx default)
  trustProxy: true
  ## @param config.repoUrl edu-sharing repository base — all live queries + the thumbnail proxy
  repoUrl: https://redaktion.openeduhub.net
  ## @param config.searchUrl WLO search base — the per-source "contents in search" link
  searchUrl: https://suche.wirlernenonline.de
  ## @param config.extraEnv Extra plain environment variables (map) injected into the container
  extraEnv: {}

log:
  ## @param log.format Log format: json (one JSON object per line, default) or text
  format: json
  ## @param log.level Log level (DEBUG, INFO, WARNING, ERROR)
  level: INFO

########################################################################################################################

## @section Data volume (team role only)
persistence:
  ## @param persistence.size Size of the team's data volume (/data: truth.json, raw caches, exports, CSVs)
  size: 2Gi
  ## @param persistence.storageClass Storage class of the volume ("" = cluster default)
  storageClass: ""
  ## @param persistence.existingClaim Use this existing PVC instead of creating one
  existingClaim: ""

########################################################################################################################

## @section Network policy
networkPolicy:
  ## @param networkPolicy.enabled Restrict traffic: in 8080 (see ingressNamespace), 9090 only from quellenpanel pods and monitoring; out DNS, HTTPS 443, partner/public also team:9090
  enabled: false
  ## @param networkPolicy.monitoringNamespace Namespace of Prometheus (allowed to scrape 9090)
  monitoringNamespace: monitoring
  ## @param networkPolicy.ingressNamespace Namespace of the ingress controller; if set, only it reaches 8080 (empty = from anywhere)
  ingressNamespace: ""
  ## @param networkPolicy.extraEgress Additional egress rules (NetworkPolicy egress entries), e.g. an HTTP export source on another port
  extraEgress: []

########################################################################################################################

## @section Metrics (Prometheus Operator)
metrics:
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor scraping /metrics on the internal Service
    enabled: false
    ## @param metrics.serviceMonitor.interval Scrape interval
    interval: 30s
    ## @param metrics.serviceMonitor.labels Extra labels (e.g. release: prometheus) so Prometheus selects it
    labels: {}
  prometheusRule:
    ## @param metrics.prometheusRule.enabled Create the PrometheusRule with the alerts (RebuildStale, High5xx, ExportFetchFailing)
    enabled: false
    ## @param metrics.prometheusRule.labels Extra labels so Prometheus selects the rule
    labels: {}

########

## @param debug Enable debugging for this release (overrides global.debug)
debug: false

########################################################################################################################

## @param nodeAffinity Set node affinity
nodeAffinity: {}

## @param tolerations Set tolerations
tolerations: []

## @param podAnnotations Set custom pod annotations
podAnnotations: {}

podSecurityContext:
  ## @param podSecurityContext.fsGroup Set fs group (matches the image's app user, uid 10001)
  fsGroup: 10001
  ## @param podSecurityContext.fsGroupChangePolicy Set change policy for fs group
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    ## @param podSecurityContext.seccompProfile.type Seccomp profile of the pod
    type: RuntimeDefault

securityContext:
  ## @param securityContext.runAsUser User id to run as (image's "appuser", uid 10001). The rest of the
  ##        container securityContext is fixed to the restricted profile (read-only root FS, no
  ##        privilege escalation, all capabilities dropped, seccomp RuntimeDefault).
  runAsUser: 10001

########################################################################################################################

## @param terminationGracePeriod Grace period for termination in seconds (> preStopSleepSeconds + 20 s uvicorn)
terminationGracePeriod: 30
## @param preStopSleepSeconds Pause before SIGTERM so the pod leaves the Service first (0 = off)
preStopSleepSeconds: 5

startupProbe:
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe (liveness of the process only; data may still be building)
  failureThreshold: 30
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  initialDelaySeconds: 5
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  periodSeconds: 5
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  successThreshold: 1
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  timeoutSeconds: 5

livenessProbe:
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  failureThreshold: 3
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  initialDelaySeconds: 0
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  periodSeconds: 30
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  timeoutSeconds: 5

readinessProbe:
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  failureThreshold: 3
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  initialDelaySeconds: 0
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  periodSeconds: 10
  ## @param readinessProbe.successThreshold Set threshold for success on readiness probe
  successThreshold: 1
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  timeoutSeconds: 5

########################################################################################################################

resources:

  limits:
    ## @param resources.limits.cpu Set CPU limit on resources
    cpu: 1000m
    ## @param resources.limits.memory Set memory limit on resources
    memory: 1Gi
  requests:
    ## @param resources.requests.cpu Set CPU for requests on resources
    cpu: 100m
    ## @param resources.requests.memory Set memory for requests on resources
    memory: 384Mi

########################################################################################################################
