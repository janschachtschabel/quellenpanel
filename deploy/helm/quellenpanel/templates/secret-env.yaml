{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quellenpanel.fullname" . }}-env
  labels: {{ include "quellenpanel.labels" . | nindent 4 }}
type: Opaque
data:
  # Empty QE_TEAM_PASSWORD ⇒ no team access (fail-closed); empty QE_TIER1_PASSWORD ⇒ tier 1 closed on
  # the partner role; empty QE_SESSION_SECRET ⇒ team logins end on restart. Prefer existingSecret
  # (sealed/external secret) in production.
  QE_TEAM_PASSWORD: {{ .Values.config.teamPassword | b64enc | quote }}
  QE_TIER1_PASSWORD: {{ .Values.config.tier1Password | b64enc | quote }}
  QE_SESSION_SECRET: {{ .Values.config.sessionSecret | b64enc | quote }}
{{- end }}
