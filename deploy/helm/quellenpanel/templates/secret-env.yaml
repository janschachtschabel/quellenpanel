apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quellenpanel.fullname" . }}-env
  labels: {{ include "quellenpanel.labels" . | nindent 4 }}
type: Opaque
data:
  # Both OPTIONAL. Empty QE_TEAM_PASSWORD ⇒ team tier (Audit) disabled, fail-closed; empty
  # QE_TIER1_PASSWORD ⇒ tier 1 (Details) open. Set them (ideally via --set or a sealed secret)
  # to enable / gate the tiers.
  QE_TEAM_PASSWORD: {{ .Values.config.teamPassword | b64enc | quote }}
  QE_TIER1_PASSWORD: {{ .Values.config.tier1Password | b64enc | quote }}
