{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "quellenpanel.fullname" . }}
  labels:
    {{- include "quellenpanel.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "quellenpanel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part: internal
  endpoints:
  - port: internal
    path: /metrics
    interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
