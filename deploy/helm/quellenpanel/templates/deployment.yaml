apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quellenpanel.fullname" . }}
  labels: {{ include "quellenpanel.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.config.role "team" }}
  # Team: exactly one pod owns the data volume and the rebuild job; Recreate so two never overlap.
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  # Partner/public hold only the export (fetched from the team), so they scale freely.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{ include "quellenpanel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "quellenpanel.labels" . | nindent 8 }}
      annotations:
        checksum/configmap-env: {{ include (print .Template.BasePath "/configmap-env.yaml") . | sha256sum | trunc 63 }}
        checksum/secret-env: {{ include (print .Template.BasePath "/secret-env.yaml") . | sha256sum | trunc 63 }}
        {{- with merge .Values.podAnnotations .Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with merge .Values.podSecurityContext .Values.global.security }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAffinity }}
      affinity:
        nodeAffinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.terminationGracePeriod }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
      - name: {{ include "quellenpanel.name" . }}
        image: {{ include "quellenpanel.image" . }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: {{ include "quellenpanel.fullname" . }}-env
        - secretRef:
            name: {{ include "quellenpanel.secretName" . }}
        ports:
        - name: http
          containerPort: 8080
        - name: internal
          containerPort: 9090
        {{- with .Values.startupProbe }}
        startupProbe:
          httpGet:
            path: /health
            port: internal
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          httpGet:
            path: /health
            port: internal
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        # Leitfaden: readiness without dependencies, on the PUBLIC port, so a pod with a broken API
        # listener leaves the rotation. A pod without data stays in its Service and answers the data
        # routes with JSON 503 + Retry-After (the team can still log in and start a rebuild).
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          failureThreshold: {{ .failureThreshold }}
          initialDelaySeconds: {{ .initialDelaySeconds }}
          periodSeconds: {{ .periodSeconds }}
          successThreshold: {{ .successThreshold }}
          timeoutSeconds: {{ .timeoutSeconds }}
        {{- end }}
        # Clean shutdown: the pause lets the endpoints controller take the pod out of the Service
        # before SIGTERM; uvicorn then gives running requests 20 s (serve.GRACEFUL_SECONDS).
        {{- if .Values.preStopSleepSeconds }}
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
        {{- end }}
        {{- with .Values.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        # Restricted Pod Security profile, not configurable: writes go to /data and /tmp only.
        securityContext:
          runAsNonRoot: true
          runAsUser: {{ .Values.securityContext.runAsUser }}
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        {{- if eq .Values.config.role "team" }}
        persistentVolumeClaim:
          claimName: {{ default (printf "%s-data" (include "quellenpanel.fullname" .)) .Values.persistence.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
