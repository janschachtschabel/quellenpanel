apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quellenpanel.fullname" . }}-env
  labels: {{ include "quellenpanel.labels" . | nindent 4 }}
data:
  # ---- Access tiers (all optional; unset = end-user-only, fail-closed). Passwords are in the Secret. ----
  QE_PUBLIC_ONLY: {{ .Values.config.publicOnly | quote }}
  QE_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  QE_AUTO_REFRESH_HOUR: {{ .Values.config.autoRefreshHour | quote }}
  # ---- Repository neutrality (live queries + "view in search" link) ----
  QE_REPO_URL: {{ .Values.config.repoUrl | quote }}
  QE_SEARCH_URL: {{ .Values.config.searchUrl | quote }}
  # The pod is only reachable via the ingress (ClusterIP), which sets X-Forwarded-For to the real
  # client IP — so let uvicorn trust the proxy headers, giving the per-client rate limits the true
  # client IP instead of the ingress address. (uvicorn reads this env as --forwarded-allow-ips.)
  FORWARDED_ALLOW_IPS: "*"
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
