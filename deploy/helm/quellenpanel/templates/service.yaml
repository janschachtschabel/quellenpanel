apiVersion: v1
kind: Service
metadata:
  name: {{ include "quellenpanel.fullname" . }}
  labels: {{ include "quellenpanel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{ include "quellenpanel.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
