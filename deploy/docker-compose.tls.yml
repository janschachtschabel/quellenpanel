# WLO Quellenpanel — three instances WITH automatic HTTPS (Caddy + nip.io/sslip.io).
# Start:  docker compose -f docker-compose.tls.yml up -d
# Config in .env (see .env.example): IMAGE, SITE_ADDRESS (public), PARTNER_ADDRESS, plus the
# access-tier vars. Only Caddy listens publicly (80/443). The team instance stays on 127.0.0.1.
x-common: &common
  image: ${IMAGE:?please set IMAGE in .env (e.g. youruser/quellenpanel:0.3.0)}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  user: "10001"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  team:
    <<: *common
    container_name: quellenpanel-team
    ports:
      - "127.0.0.1:${TEAM_PORT:-8082}:8080"
    volumes:
      - quellenpanel-data:/data
    environment:
      - QE_ROLE=team
      - QE_TEAM_PASSWORD=${QE_TEAM_PASSWORD:-}
      - QE_SESSION_SECRET=${QE_SESSION_SECRET:-}
      - QE_SEED_URL=${QE_SEED_URL:-}
      - QE_AUTO_REFRESH_HOUR=${QE_AUTO_REFRESH_HOUR:-}
      - QE_REPO_URL=${QE_REPO_URL:-https://redaktion.openeduhub.net}
      - QE_SEARCH_URL=${QE_SEARCH_URL:-https://suche.wirlernenonline.de}

  # partner and public are reachable ONLY via Caddy (expose, no published ports). Caddy overwrites
  # X-Forwarded-For with the real client IP, so TRUST_PROXY=1 lets the rate limits key on it. Never
  # set TRUST_PROXY where the app port is published directly: a client could forge the header.
  partner:
    <<: *common
    container_name: quellenpanel-partner
    expose:
      - "8080"
    environment:
      - QE_ROLE=partner
      - TRUST_PROXY=1
      - QE_TIER1_PASSWORD=${QE_TIER1_PASSWORD:-}
      - QE_EXPORT_SOURCE=http://team:9090/internal/exports/stufe{tier}.json
      - QE_EXPORT_POLL_MINUTES=${QE_EXPORT_POLL_MINUTES:-10}
      - QE_REPO_URL=${QE_REPO_URL:-https://redaktion.openeduhub.net}
      - QE_SEARCH_URL=${QE_SEARCH_URL:-https://suche.wirlernenonline.de}
    depends_on:
      - team

  public:
    <<: *common
    container_name: quellenpanel-public
    expose:
      - "8080"
    environment:
      - QE_ROLE=public
      - TRUST_PROXY=1
      - QE_EXPORT_SOURCE=http://team:9090/internal/exports/stufe{tier}.json
      - QE_EXPORT_POLL_MINUTES=${QE_EXPORT_POLL_MINUTES:-10}
      - QE_REPO_URL=${QE_REPO_URL:-https://redaktion.openeduhub.net}
      - QE_SEARCH_URL=${QE_SEARCH_URL:-https://suche.wirlernenonline.de}
    depends_on:
      - team

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?please set SITE_ADDRESS in .env (e.g. quellen.31.70.69.94.nip.io)}
      - PARTNER_ADDRESS=${PARTNER_ADDRESS:?please set PARTNER_ADDRESS in .env (e.g. steckbrief.31.70.69.94.nip.io)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # keep certificates across restarts (else re-issued every restart)
      - caddy_config:/config
    depends_on:
      - partner
      - public

volumes:
  quellenpanel-data:
  caddy_data:
  caddy_config:
